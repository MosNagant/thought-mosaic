<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f3f3">
  <meta name="description" content="Thought Mosaic — 随手收集想法、图片与声音，让零散的灵感慢慢拼在一起。">
  <title>Thought Mosaic · 灵感记录</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="app"><div class="loading">正在打开 Thought Mosaic…</div></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <input id="image-picker" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple hidden>
  <input id="backup-picker" type="file" accept="application/json,.json" hidden>
  <noscript>请启用 JavaScript 来使用 Thought Mosaic。</noscript>
</body>
</html>
